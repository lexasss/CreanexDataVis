name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    env:
      PROJECT_PATH: src\CreanexDataVis.csproj
      PUBLISH_PROFILE: FolderProfile
      OUTPUT_DIR: publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish WPF application
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release
          /p:PublishProfile=${{ env.PUBLISH_PROFILE }}
          -o "${{ env.OUTPUT_DIR }}"

      - name: Create ZIP archive
        run: |
          Compress-Archive `
            -Path "${{ env.OUTPUT_DIR }}\*" `
            -DestinationPath "${{ github.event.repository.name }}-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip